name: ProformatWeb

on:
  push:
    paths: ['ProformatWeb/**', '.github/workflows/proformat-web.yml']
  pull_request:
    paths: ['ProformatWeb/**', '.github/workflows/proformat-web.yml']

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProformatWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ProformatWeb/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: ProformatWeb/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ProformatWeb/server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/proformat_test
